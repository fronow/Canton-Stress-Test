// Four participants, one sequencer and one mediator on one synchronizer.
// Same as two-participants.conf plus participant3 and participant4; used to
// measure how the traffic bill changes with the number of participants.
//
// `daml sandbox` gives ONE participant with an in-process synchronizer, which
// is enough to measure an app but not enough to measure a topology. This is
// what makes cross-participant workflows — and therefore party-to-participant
// placement, per-participant latency and real multi-node load — testable.
//
// Everything is in-memory: this is a test rig, not a deployment.

canton {
  parameters {
    // Test rig: skip the production safety checks that would otherwise refuse
    // an unsafe (in-memory, dev-protocol) setup.
    non-standard-config = yes
  }

  participants {
    participant1 {
      storage.type = memory
      admin-api.port = 5012
      ledger-api.port = 5011
      http-ledger-api {
        server.port = 7011
      }
    }
    participant2 {
      storage.type = memory
      admin-api.port = 5022
      ledger-api.port = 5021
      http-ledger-api {
        server.port = 7021
      }
    }
    participant3 {
      storage.type = memory
      admin-api.port = 5032
      ledger-api.port = 5031
      http-ledger-api {
        server.port = 7031
      }
    }
    participant4 {
      storage.type = memory
      admin-api.port = 5042
      ledger-api.port = 5041
      http-ledger-api {
        server.port = 7041
      }
    }
  }

  sequencers {
    sequencer1 {
      storage.type = memory
      public-api.port = 5001
      admin-api.port = 5002
    }
  }

  mediators {
    mediator1 {
      storage.type = memory
      admin-api.port = 5003
    }
  }
}
