// A participant that REQUIRES a bearer token — what every real deployment
// looks like, and what a sandbox never is.
//
// Uses `unsafe-jwt-hmac-256`, which Canton names honestly: a shared secret is
// not how production issues tokens (an IdP does). It exists so the
// authenticated code path can be exercised end to end. The client side is the
// same either way: an `Authorization: Bearer …` header.
//
//   canton daemon -c authenticated.conf --bootstrap bootstrap-auth.canton
//   node src/cli.ts run <dar> --api http://localhost:7011 \
//     --auth-hs256-secret "canton-stress-test-secret" ...

canton {
  parameters {
    non-standard-config = yes
  }

  participants {
    participant1 {
      storage.type = memory
      admin-api.port = 5012
      ledger-api {
        port = 5011
        auth-services = [
          {
            // TEST FIXTURE, NOT A CREDENTIAL. Canton names this mode "unsafe"
            // for good reason: it accepts any token signed with the shared
            // string below, which is why that string is a visible placeholder.
            // It exists so the authentication path can be exercised against a
            // local rig. Never use this mode, or this value, anywhere real.
            type = unsafe-jwt-hmac-256
            secret = "canton-stress-test-secret"
          }
        ]
      }
      http-ledger-api {
        server.port = 7011
      }
    }
  }

  sequencers {
    sequencer1 {
      storage.type = memory
      public-api.port = 5001
      admin-api.port = 5002
    }
  }

  mediators {
    mediator1 {
      storage.type = memory
      admin-api.port = 5003
    }
  }
}
