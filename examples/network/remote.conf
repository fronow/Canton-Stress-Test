// A console that ATTACHES to the running two-participant network instead of
// starting its own nodes. Used to read billed traffic from outside:
//   canton run traffic-state.canton -c remote.conf
// Ports match two-participants.conf.

canton {
  remote-mediators {
    mediator1 { admin-api.port = 5003 }
  }
  remote-sequencers {
    sequencer1 {
      public-api {
        address = "localhost"
        port = 5001
      }
      admin-api.port = 5002
    }
  }
  remote-participants {
    participant1 {
      admin-api.port = 5012
      ledger-api.port = 5011
    }
    participant2 {
      admin-api.port = 5022
      ledger-api.port = 5021
    }
  }
}
