name: perf-gate

# Per-PR performance gate. Boots a local Canton sandbox, runs a load test at a
# target arrival rate, and FAILS the job if the app breaches an SLA (min
# throughput / max p99 / max contention). Attaches the HTML report as an
# artifact. Point DAR_PROJECT + the thresholds at your own app.
#
# Needs the Daml SDK and an OpenJDK (Oracle JDK does not work with Canton), so
# this is heavier than ci.yml — keep it a separate workflow.

on:
  pull_request:
  workflow_dispatch:

env:
  DAR_PROJECT: ../tool/examples/sample-token   # replace with your app
  TEMPLATE: "#daml-fuzz-sample:SampleToken:Token"
  DAML_SDK_VERSION: 3.4.11

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the Daml SDK
        run: |
          curl -sSL https://get.daml.com/ | sh -s ${{ env.DAML_SDK_VERSION }}
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"

      - name: Build the DAR
        working-directory: ${{ env.DAR_PROJECT }}
        run: daml build

      - name: Load test + SLA gate (fails the job on a breach)
        run: |
          DAR=$(ls ${{ env.DAR_PROJECT }}/.daml/dist/*.dar | head -1)
          node src/cli.ts run "$DAR" --template "${{ env.TEMPLATE }}" \
            --workload create --model open --rate 10 --ops 200 --warmup 20 \
            --sandbox --report perf-report.json \
            --min-throughput 5 --max-p99 3000 --max-contention 5
          node src/cli.ts report perf-report.json --out perf-report.html

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canton-stress-perf-report
          path: |
            perf-report.json
            perf-report.html
          if-no-files-found: ignore
